services:
  # 1. Express API Web Service (with Socket.IO)
  - type: web
    name: food-delivery-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_API_VERSION
        value: 2025-01-01

  # 2. BullMQ Background Worker
  - type: worker
    name: food-delivery-worker
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        fromService:
          type: web
          name: food-delivery-api
          envVarKey: MONGODB_URI
      - key: REDIS_URL
        fromService:
          type: web
          name: food-delivery-api
          envVarKey: REDIS_URL
      - key: EMAIL_USER
        fromService:
          type: web
          name: food-delivery-api
          envVarKey: EMAIL_USER
      - key: EMAIL_PASSWORD
        fromService:
          type: web
          name: food-delivery-api
          envVarKey: EMAIL_PASSWORD
