version: '3.8'

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/food-delivery
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=docker_dev_access_secret_key_12345
      - JWT_REFRESH_SECRET=docker_dev_refresh_secret_key_12345
      - CLIENT_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "src/workers/email.worker.js"]
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/food-delivery
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
